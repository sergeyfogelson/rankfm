name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    name: tests (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
        include:
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: build extension
        run: python setup.py build_ext --inplace
      - name: lint
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m flake8 --ignore W3,E3,E5,E74 rankfm/
      - name: test
        run: python -m pytest -r Efp tests/

  container:
    name: container training run (x86 linux, 2-CPU limit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: host CPU
        run: |
          nproc
          lscpu | grep -E "Model name|Architecture"
          grep -o -w -E "avx2|fma|avx512f" /proc/cpuinfo | sort | uniq -c
      - name: build images
        run: |
          docker build -t rankfm:generic .
          docker build --build-arg RANKFM_MARCH=x86-64-v3 -t rankfm:v3 .
      - name: generic build, limited to 2 CPUs
        run: docker run --rm --cpus=2 -e EXPECT_CPUS=2 rankfm:generic
      - name: x86-64-v3 build, limited to 2 CPUs
        run: docker run --rm --cpus=2 -e EXPECT_CPUS=2 rankfm:v3
      - name: x86-64-v3 build, no CPU limit
        run: docker run --rm rankfm:v3
