version: 2

jobs:
  build:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          command: |
            pip install --upgrade pip
            pip install -r requirements.txt
            python setup.py build_ext --inplace
      - run: python -m flake8 --ignore W3,E3,E5,E74 rankfm/
      - run: python -m pytest -r Efp tests/
